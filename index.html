<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ShopSnap Pro</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShopSnap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --primary:#2563eb; --primary-dark:#1d4ed8; --success:#16a34a;
    --bg:#f1f5f9; --card:#fff; --text:#0f172a; --text-muted:#64748b;
    --border:#e2e8f0; --radius:12px; --shadow:0 2px 12px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
    padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;text-align:center;
    box-shadow:0 4px 20px rgba(37,99,235,.25);position:sticky;top:0;z-index:100}
  header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
  header p{font-size:13px;opacity:.85;margin-top:4px}
  .wrap{max-width:600px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
    box-shadow:var(--shadow);border:1px solid var(--border)}
  .card h2{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:14px;
    display:flex;align-items:center;gap:10px}
  .card h2 .num{background:var(--primary);color:#fff;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
  label{display:block;font-size:12px;margin:12px 0 5px;font-weight:600;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:.5px}
  input[type=text]{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:10px;
    font-size:15px;font-family:inherit;background:#f8fafc;transition:border-color .2s}
  input[type=text]:focus{outline:none;border-color:var(--primary);background:#fff}
  .cam-box{position:relative;width:100%;aspect-ratio:1/1;background:#0f172a;border-radius:var(--radius);
    overflow:hidden;margin-bottom:12px}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .cam-overlay{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
  .guide-frame{width:80%;height:80%;border:2px dashed rgba(255,255,255,.7);border-radius:16px;
    position:relative;transition:all .4s cubic-bezier(.4,0,.2,1)}
  .guide-frame.side{width:55%;height:80%}
  .guide-frame.round{width:60%;height:60%;border-radius:50%}
  .guide-frame::before,.guide-frame::after{content:'';position:absolute;width:24px;height:24px;
    border:3px solid #22d3ee}
  .guide-frame::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:12px}
  .guide-frame::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:12px}
  .cam-badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#22d3ee;
    color:#0f172a;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:700;
    white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .cam-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:12px;white-space:nowrap;backdrop-filter:blur(8px)}
  button{font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:10px;
    padding:14px 20px;cursor:pointer;transition:all .15s;width:100%;touch-action:manipulation}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-secondary{background:var(--border);color:var(--text)}
  .btn-success{background:var(--success);color:#fff;font-size:16px;padding:16px}
  .btn-row{display:flex;gap:10px}
  .shots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  .shot{aspect-ratio:1/1;border-radius:10px;border:2px dashed var(--border);background:#f8fafc;
    display:grid;place-items:center;font-size:10px;color:var(--text-muted);text-align:center;
    overflow:hidden;position:relative;padding:4px;transition:border-color .3s}
  .shot.filled{border-style:solid;border-color:var(--success);padding:0}
  .shot img{width:100%;height:100%;object-fit:cover}
  .shot .check{position:absolute;top:3px;right:3px;background:var(--success);color:#fff;
    width:18px;height:18px;border-radius:50%;font-size:11px;display:grid;place-items:center;
    font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .progress-bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;
    margin:12px 0;display:none}
  .progress-bar.active{display:block}
  .progress-bar>div{height:100%;width:0;background:var(--success);transition:width .3s ease}
  .status-text{font-size:13px;color:var(--text-muted);text-align:center;margin-top:6px}
  .results-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
  .result-item{background:#fff;border-radius:10px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);
    border:1px solid var(--border);text-align:center}
  .result-item img{width:100%;border-radius:6px;background:#f8fafc;aspect-ratio:1/1;object-fit:cover}
  .result-item .label{font-size:11px;color:var(--text-muted);margin:6px 0 4px;font-weight:600}
  .result-item a{display:inline-block;font-size:12px;color:var(--primary);text-decoration:none;
    font-weight:600;padding:4px 12px;background:#eff6ff;border-radius:6px}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;
    transform:translateX(-50%) translateY(100px);background:#1e293b;color:#fff;padding:12px 24px;
    border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;
    z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;
    vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .install-banner{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:14px;
    border-radius:var(--radius);margin-bottom:14px;display:flex;align-items:center;gap:12px;
    box-shadow:0 4px 16px rgba(22,163,74,.3);cursor:pointer}
  .install-banner .ico{font-size:28px}
  .install-banner .txt{flex:1}
  .install-banner .txt b{font-size:14px;display:block}
  .install-banner .txt span{font-size:12px;opacity:.9}
  .install-banner button{width:auto;padding:8px 16px;background:rgba(255,255,255,.2);
    border:1px solid rgba(255,255,255,.4);color:#fff;font-size:13px;border-radius:8px}
</style>
</head>
<body>

<header>
  <h1>📸 ShopSnap Pro</h1>
  <p>4 एंगल प्रोडक्ट फोटो · ऑनलाइन बिक्री के लिए तैयार</p>
</header>

<div class="wrap">

  <div class="install-banner hidden" id="installBanner">
    <div class="ico">📲</div>
    <div class="txt"><b>फोन में ऐप इंस्टॉल करें</b><span>होम स्क्रीन पर आइकन बनाएँ</span></div>
    <button id="btnInstall">इंस्टॉल</button>
  </div>

  <div class="card">
    <h2><span class="num">1</span> दुकान की जानकारी</h2>
    <label>दुकान का नाम</label>
    <input type="text" id="shopName" placeholder="जैसे: शर्मा कपड़ा भंडार">
    <label>प्रोडक्ट का नाम</label>
    <input type="text" id="prodName" placeholder="जैसे: कॉटन साड़ी - लाल">
    <label>कीमत (वैकल्पिक)</label>
    <input type="text" id="prodPrice" placeholder="जैसे: ₹499" inputmode="decimal">
  </div>

  <div class="card">
    <h2><span class="num">2</span> फोटो लें</h2>
    <div class="cam-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="cam-overlay"><div class="guide-frame" id="guideFrame"></div></div>
      <div class="cam-badge" id="camBadge">सामने से</div>
      <div class="cam-hint" id="camHint">प्रोडक्ट को बॉक्स के बीच रखें</div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btnCapture">📷 फोटो लें</button>
      <button class="btn-secondary" id="btnUpload">🖼️ गैलरी</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
    <div class="shots-grid" id="shotsGrid"></div>
    <button class="btn-secondary" id="btnReset">🔄 दोबारा शुरू करें</button>
  </div>

  <div class="card">
    <h2><span class="num">3</span> इमेज तैयार करें</h2>
    <button class="btn-success" id="btnProcess" disabled>✨ बैकग्राउंड हटाकर इमेज बनाएँ</button>
    <div class="progress-bar" id="progressBar"><div id="progressFill"></div></div>
    <div class="status-text" id="statusText"></div>
    <div class="results-grid" id="resultsGrid"></div>
    <button class="btn-primary hidden" id="btnZip" style="margin-top:12px;background:#7c3aed">📦 सब ZIP में डाउनलोड करें</button>
    <p style="font-size:11px;color:var(--text-muted);margin-top:10px;line-height:1.6">
      पहली बार मॉडल डाउनलोड होगा (~40MB)। इसके बाद ऑफलाइन भी काम करेगा।
    </p>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
const ANGLES = [
  {key:'front',label:'सामने से',hint:'प्रोडक्ट सीधा सामने से',frameClass:''},
  {key:'back',label:'पीछे से',hint:'प्रोडक्ट का पिछला हिस्सा',frameClass:''},
  {key:'side',label:'बगल से',hint:'प्रोडक्ट को बगल से दिखाएँ',frameClass:'side'},
  {key:'close',label:'क्लोज़-अप',hint:'डिज़ाइन/कपड़े की बारीकी',frameClass:'round'}
];
const OUTPUT_SIZE = 1000;
const MAX_INPUT_DIM = 1600;
const JPEG_QUALITY = 0.92;

const state = {currentAngle:0,shots:[null,null,null,null],results:[],isProcessing:false,stream:null,deferredPrompt:null};
const $ = id => document.getElementById(id);
const video=$('video'),guideFrame=$('guideFrame'),camBadge=$('camBadge'),camHint=$('camHint');
const btnCapture=$('btnCapture'),btnUpload=$('btnUpload'),btnReset=$('btnReset');
const fileInput=$('fileInput'),shotsGrid=$('shotsGrid');
const btnProcess=$('btnProcess'),progressBar=$('progressBar'),progressFill=$('progressFill');
const statusText=$('statusText'),resultsGrid=$('resultsGrid'),btnZip=$('btnZip');
const toast=$('toast'),installBanner=$('installBanner'),btnInstall=$('btnInstall');

function showToast(msg,d=2500){toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),d);}

function drawToCanvas(img,maxDim=MAX_INPUT_DIM){
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  if(w>maxDim||h>maxDim){const s=Math.min(maxDim/w,maxDim/h);w=Math.round(w*s);h=Math.round(h*s);}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);return c;
}
async function compressImage(src){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{const c=drawToCanvas(img);
      c.toBlob(b=>b?res(b):rej(new Error('compress failed')),'image/jpeg',JPEG_QUALITY);};
    img.onerror=()=>rej(new Error('load failed'));
    img.src=(src instanceof Blob)?URL.createObjectURL(src):src;
  });
}

async function startCamera(){
  try{
    if(state.stream)state.stream.getTracks().forEach(t=>t.stop());
    state.stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1280}},audio:false});
    video.srcObject=state.stream;video.classList.remove('hidden');
  }catch(e){
    video.classList.add('hidden');
    camHint.textContent='कैमरा नहीं खुला — गैलरी बटन दबाएँ';
  }
}

function renderShots(){
  shotsGrid.innerHTML='';
  ANGLES.forEach((a,i)=>{
    const d=document.createElement('div');
    d.className='shot'+(state.shots[i]?' filled':'');
    d.innerHTML=state.shots[i]?`<img src="${state.shots[i]}"><div class="check">✓</div>`:a.label;
    shotsGrid.appendChild(d);
  });
  btnProcess.disabled=state.shots.filter(Boolean).length<4||state.isProcessing;
}
function updateGuide(){
  const a=ANGLES[state.currentAngle];
  guideFrame.className='guide-frame '+a.frameClass;
  camBadge.textContent=a.label;camHint.textContent=a.hint;
}
function capturePhoto(){
  if(state.currentAngle>=4||state.isProcessing)return;
  if(!video.videoWidth || !video.videoHeight){
    showToast('कैमरा तैयार नहीं है! गैलरी बटन दबाएँ');return;
  }
  const s=Math.min(video.videoWidth||640,video.videoHeight||640);
  const c=document.createElement('canvas');c.width=c.height=s;
  c.getContext('2d').drawImage(video,(video.videoWidth-s)/2,(video.videoHeight-s)/2,s,s,0,0,s,s);
  state.shots[state.currentAngle]=c.toDataURL('image/jpeg',0.92);
  advanceAngle();
}
function advanceAngle(){
  state.currentAngle++;renderShots();
  if(state.currentAngle>=4){
    camBadge.textContent='सभी फोटो तैयार! ✓';
    camHint.textContent='नीचे "इमेज बनाएँ" दबाएँ';
    btnCapture.disabled=true;btnUpload.disabled=true;
  }else updateGuide();
}
function handleFileUpload(file){
  if(!file||state.currentAngle>=4)return;
  const r=new FileReader();
  r.onload=e=>{const img=new Image();
    img.onload=()=>{const c=drawToCanvas(img);
      state.shots[state.currentAngle]=c.toDataURL('image/jpeg',0.92);advanceAngle();};
    img.src=e.target.result;};
  r.readAsDataURL(file);
}

async function processWithWorker(blob){
  return new Promise((resolve,reject)=>{
    const code=`
      self.onmessage=async(e)=>{
        try{
          const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.mjs');
          const r=await removeBackground(e.data.blob,{output:{format:'image/png'},model:'medium'});
          self.postMessage({type:'done',blob:r});
        }catch(err){self.postMessage({type:'error',message:err.message});}
      };`;
    const w=new Worker(URL.createObjectURL(new Blob([code],{type:'application/javascript'})),{type:'module'});
    w.onmessage=e=>{if(e.data.type==='done'){w.terminate();resolve(e.data.blob);}
      if(e.data.type==='error'){w.terminate();reject(new Error(e.data.message));}};
    w.onerror=err=>{w.terminate();reject(err);};
    w.postMessage({blob});
  });
}
async function processWithMainThread(blob){
  const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.mjs');
  return removeBackground(blob,{output:{format:'image/png'},model:'medium'});
}
async function composeFinalImage(cutoutBlob){
  const url=URL.createObjectURL(cutoutBlob);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const c=document.createElement('canvas');c.width=c.height=OUTPUT_SIZE;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,OUTPUT_SIZE,OUTPUT_SIZE);
  const pad=90,maxW=OUTPUT_SIZE-pad*2,maxH=OUTPUT_SIZE-pad*2-80;
  const scale=Math.min(maxW/img.width,maxH/img.height);
  const w=img.width*scale,h=img.height*scale;
  ctx.drawImage(img,(OUTPUT_SIZE-w)/2,(OUTPUT_SIZE-h)/2-30,w,h);
  const shop=$('shopName').value.trim(),prod=$('prodName').value.trim(),price=$('prodPrice').value.trim();
  ctx.textAlign='center';
  if(prod){ctx.fillStyle='#1e293b';ctx.font='bold 36px -apple-system,sans-serif';ctx.fillText(prod,OUTPUT_SIZE/2,OUTPUT_SIZE-60);}
  if(price){ctx.fillStyle='#16a34a';ctx.font='bold 34px -apple-system,sans-serif';ctx.fillText(price,OUTPUT_SIZE/2,OUTPUT_SIZE-20);}
  if(shop){ctx.fillStyle='rgba(37,99,235,0.65)';ctx.font='bold 22px -apple-system,sans-serif';
    ctx.textAlign='right';ctx.fillText(shop,OUTPUT_SIZE-24,40);}
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',0.9);
}
async function processAllImages(){
  if(state.isProcessing)return;
  state.isProcessing=true;btnProcess.disabled=true;
  btnProcess.innerHTML='<span class="loading-spinner"></span> प्रोसेस हो रहा है...';
  progressBar.classList.add('active');resultsGrid.innerHTML='';state.results=[];
  for(let i=0;i<4;i++){
    statusText.textContent=`${ANGLES[i].label} प्रोसेस हो रही है... (${i+1}/4)`;
    progressFill.style.width=`${(i/4)*100}%`;
    try{
      const compressed=await compressImage(state.shots[i]);
      let cutout;
      try{cutout=await processWithWorker(compressed);}
      catch(e){cutout=await processWithMainThread(compressed);}
      const finalImage=await composeFinalImage(cutout);
      state.results.push({label:ANGLES[i].label,data:finalImage});
    }catch(err){
      console.error(err);
      state.results.push({label:ANGLES[i].label,data:state.shots[i],failed:true});
    }
  }
  progressFill.style.width='100%';
  statusText.textContent='✓ सभी इमेज तैयार हैं!';
  renderResults();
  btnProcess.innerHTML='✨ बैकग्राउंड हटाकर इमेज बनाएँ';
  state.isProcessing=false;
}
function renderResults(){
  resultsGrid.innerHTML='';
  state.results.forEach((r,i)=>{
    const d=document.createElement('div');d.className='result-item';
    d.innerHTML=`<img src="${r.data}"><div class="label">${r.label}${r.failed?' ⚠️':''}</div>
      <a download="product-${i+1}-${r.label}.jpg" href="${r.data}">⬇ डाउनलोड</a>`;
    resultsGrid.appendChild(d);
  });
  if(state.results.length===4)btnZip.classList.remove('hidden');
}
async function downloadZip(){
  if(!state.results.length)return;
  showToast('ZIP बन रहा है...');
  try{
    if(!window.JSZip){
      await new Promise((res,rej)=>{const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    }
    const zip=new JSZip();
    state.results.forEach((r,i)=>{zip.file(`product-${i+1}-${r.label}.jpg`,r.data.split(',')[1],{base64:true});});
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=($('prodName').value.trim()||'product')+'-photos.zip';a.click();
    URL.revokeObjectURL(url);showToast('✓ ZIP डाउनलोड हो गया!');
  }catch(e){console.error(e);showToast('ZIP बनाने में समस्या');}
}
function resetAll(){
  state.currentAngle=0;state.shots=[null,null,null,null];state.results=[];state.isProcessing=false;
  resultsGrid.innerHTML='';btnZip.classList.add('hidden');
  progressBar.classList.remove('active');statusText.textContent='';
  btnCapture.disabled=false;btnUpload.disabled=false;btnProcess.disabled=true;
  btnProcess.innerHTML='✨ बैकग्राउंड हटाकर इमेज बनाएँ';
  updateGuide();renderShots();showToast('दोबारा शुरू!');
}

btnCapture.onclick=capturePhoto;
btnUpload.onclick=()=>fileInput.click();
btnReset.onclick=resetAll;
btnProcess.onclick=processAllImages;
btnZip.onclick=downloadZip;
fileInput.onchange=e=>{const f=e.target.files[0];if(f)handleFileUpload(f);fileInput.value='';};

renderShots();updateGuide();startCamera();

// ===== PWA: Service Worker =====
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW fail',e));
  });
}

// ===== PWA: Install Prompt =====
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();state.deferredPrompt=e;
  installBanner.classList.remove('hidden');
});
btnInstall.onclick=async()=>{
  if(!state.deferredPrompt)return;
  state.deferredPrompt.prompt();
